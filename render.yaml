# Render Blueprint for the FastAPI backend. In the Render dashboard: New ->
# Blueprint -> point at this repo -> Apply. Reads this file instead of
# clicking the web-service form together by hand.
#
# Runs from the repo root (not backend/) because the service needs src/,
# models/injury_risk/*.joblib, and data/processed/live_reference_snapshot.joblib
# alongside backend/ — see backend/config.py's REPO_ROOT-relative defaults.
#
# CORS_ALLOWED_ORIGINS only gates direct-browser calls (e.g. hitting /docs
# from a browser); real frontend traffic goes through the Next.js
# server-side proxy and never triggers CORS at all. Update it to the real
# Vercel domain once that's deployed — not launch-blocking before then.
services:
  - type: web
    name: injury-predictor-api
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && pip install -e .
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:3000
      # stats.nba.com blocks Render's IPs — see backend/nba_relay.py and
      # relay/main.py. Set these two in the Render dashboard (not here,
      # they're per-deploy secrets) once your relay + tunnel are running:
      #   NBA_STATS_RELAY_URL   = your tunnel's public URL
      #   NBA_STATS_RELAY_TOKEN = must match relay/.env's RELAY_TOKEN
